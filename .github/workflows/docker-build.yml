name: Docker Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: helpevents-sla
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCP_ARTIFACT_REGISTRY_HOST: ${{ secrets.GCP_ARTIFACT_REGISTRY_HOST }}
  GCP_ARTIFACT_REGISTRY_IMAGE: ${{ secrets.GCP_ARTIFACT_REGISTRY_IMAGE }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true

      - name: Smoke test image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci python -c "import se_489_mlops_project, api.main; print('image smoke test passed')"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: github.event_name != 'pull_request' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request' && env.GCP_ARTIFACT_REGISTRY_HOST != ''
        run: |
          gcloud auth configure-docker "${GCP_ARTIFACT_REGISTRY_HOST}" --quiet

      - name: Push to Artifact Registry
        if: github.event_name != 'pull_request' && env.GCP_ARTIFACT_REGISTRY_IMAGE != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_ARTIFACT_REGISTRY_IMAGE }}:latest
            ${{ env.GCP_ARTIFACT_REGISTRY_IMAGE }}:${{ github.sha }}
