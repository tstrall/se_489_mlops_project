defaults:
  - _self_
  - experiment: null   # override with +experiment=larger_forest or +experiment=fast

experiment:
  name: sla-violation-prediction

data:
  processed_dir: data/processed
  processed_file: processed_data.csv
  target: sla_violation

model:
  type: random_forest
  n_estimators: 100
  max_depth: 10
  min_samples_split: 10
  min_samples_leaf: 5
  random_state: 42

training:
  test_size: 0.2
  random_state: 42

hydra:
  job:
    chdir: false
